# SQL Server -> Snowflake, incremental by a bookmark column.
#
# SQL query sources that support bookmarks (mssql, redshift, clickhouse,
# spanner, databricks) use a `replication:` block, not rest's
# `replication_method`. The bookmark placeholder differs per connector
# (`@bookmark` here); read `faucet schema source <type>` for yours. Putting the
# placeholder in WHERE pushes the filter to the server; without it every run
# scans the whole table.
#
# The snowflake sink appends (no upsert), so delivery is at-least-once: a crash
# between a write and the bookmark save can re-deliver one page. Dedupe
# downstream on invoice_id, or pick an upsert-capable sink.
#
#   faucet validate --no-secrets mssql-incremental-to-snowflake.yaml
#   faucet doctor mssql-incremental-to-snowflake.yaml
#   faucet run mssql-incremental-to-snowflake.yaml
#   faucet state show mssql-incremental-to-snowflake.yaml
version: 1
name: erp_invoices_to_snowflake

pipeline:
  source:
    type: mssql
    config:
      connection_url: "${env:ERP_MSSQL_URL}"
      tls: { type: require }
      query: >-
        SELECT invoice_id, customer_id, amount, currency, modified_at
        FROM dbo.invoices
        WHERE modified_at > @bookmark
        ORDER BY modified_at
      replication:
        type: incremental
        column: modified_at
        initial_value: "2024-01-01T00:00:00"
      batch_size: 5000

  transforms:
    - type: keys_case
      config: { mode: snake }

  quality:
    record:
      - type: not_null
        field: invoice_id
        on_failure: abort
    batch:
      - type: unique
        fields: [invoice_id]
        on_failure: abort

  sink:
    type: snowflake
    config:
      account: acme-xy12345
      warehouse: LOAD_WH
      database: RAW
      schema: ERP
      table: INVOICES
      auth:
        type: key_pair
        config:
          user: FAUCET_LOADER
          private_key_pem: "${env:SNOWFLAKE_LOADER_PRIVATE_KEY}"

  state:
    type: file
    config:
      path: ./.faucet-state
