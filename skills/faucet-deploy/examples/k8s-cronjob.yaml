# Scheduled `faucet run` on Kubernetes. Create the inputs first:
#   kubectl create configmap orders-sync-config --from-file=pipeline.yaml=scheduled-pipeline.yaml
#   kubectl create secret generic orders-sync-env \
#     --from-literal=ORDERS_API_URL=... --from-literal=ORDERS_API_TOKEN=... \
#     --from-literal=WAREHOUSE_PG_URL=... --from-literal=FAUCET_STATE_PG_URL=...
# State lives in postgres (see the config), so pods stay disposable.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: orders-sync
spec:
  schedule: "*/15 * * * *"
  timeZone: Etc/UTC
  # Two runs of one row race on the same bookmark; never let them overlap.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 840
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: faucet
            app.kubernetes.io/component: run
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          terminationGracePeriodSeconds: 60
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: faucet
              # Pin a version-profile tag; `core` holds rest + postgres. Check with `faucet list`.
              image: ghcr.io/faucet-hq/faucet-stream:1.13.2-core
              args:
                - run
                - /etc/faucet/pipeline.yaml
                - --no-env-file
                - --log-format=json
                - --output=json
              envFrom:
                - secretRef:
                    name: orders-sync-env
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: config
                  mountPath: /etc/faucet
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: config
              configMap:
                name: orders-sync-config
            - name: tmp
              emptyDir: {}
